[package]
name = "annihilate"
# Kept in sync with pyproject.toml, which is the single source of truth for the
# version. build.rs fails the build if these two disagree.
version = "1.4.5"
edition = "2024"
description = "Beautiful neon TUI frontend for Annihilation LLM"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
color-eyre = "0.6"
unicode-width = "0.2"
arboard = "3.6.1"
serde_json = "1"
