name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Check and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint and check import sorting
        run: uv run ruff check --output-format=github --extend-select I .

      - name: Check typing
        run: uv run ty check --error-on-warning .

  tui:
    name: Check and build TUI
    # The TUI is a Windows application: it shells out to powershell and resolves
    # the venv interpreter at Scripts/python.exe. Building it anywhere else
    # would pass without exercising the platform it actually ships on.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: tui

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: tui

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --release --all-targets -- -D warnings

      # --locked so a stale Cargo.lock fails here rather than being silently
      # rewritten. build.rs also fails the build if tui/Cargo.toml and
      # pyproject.toml disagree on the version, which is the drift this job
      # exists to catch: a bump touching only pyproject.toml used to pass CI.
      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked --release
