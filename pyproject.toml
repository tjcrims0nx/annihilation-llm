[project]
name = "annihilate-llm"
version = "1.4.6"
description = "Fully automatic censorship removal for language models"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Philipp Emanuel Weidmann", email = "pew@worldwidemann.com" }
]
requires-python = ">=3.10"
keywords = ["llm", "transformer", "abliteration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "accelerate~=1.13",
    "bitsandbytes~=0.49",
    "compressed-tensors>=0.15.0",
    "datasets>=4.7,<6.0",
    "huggingface-hub~=1.7",
    "immutabledict~=4.3",
    "langdetect~=1.0",
    "lm-eval[hf]~=0.4",
    "numpy~=2.2",
    "optuna~=4.7",
    "peft~=0.19",
    "pillow>=10.0",
    "psutil~=7.2",
    "py-cpuinfo~=9.0",
    "pydantic-settings~=2.13",
    "python-dotenv~=1.0",
    "questionary~=2.1",
    "rich>=14.3,<16.0",
    "sentencepiece~=0.2",
    "tiktoken~=0.12",
    "tomli-w~=1.2",
    # torch must be declared directly: [tool.uv.sources] only applies to direct
    # dependencies, so when torch was merely transitive its index pin was ignored
    # and it resolved to the CPU wheel from PyPI while torchvision came from the
    # CUDA index. The mismatched pair fails at import with
    # "operator torchvision::nms does not exist".
    "torch>=2.13",
    "torchvision>=0.28",
    "tqdm~=4.67",
    "transformers[kernels]~=5.6",
]

[project.optional-dependencies]
research = [
    "geom-median~=0.1",
    "imageio~=2.37",
    "matplotlib~=3.10",
    "pacmap~=0.8",
    "scikit-learn~=1.7",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "ty>=0.0.5",
]

[project.urls]
Homepage = "https://github.com/tjcrims0nx/annihilation-llm"
Documentation = "https://github.com/tjcrims0nx/annihilation-llm"
Repository = "https://github.com/tjcrims0nx/annihilation-llm.git"
Issues = "https://github.com/tjcrims0nx/annihilation-llm/issues"
Changelog = "https://github.com/tjcrims0nx/annihilation-llm/releases"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# Both packages must come from the same index. torch and torchvision ship
# compiled extensions that link against each other's ABI, so a CPU torch with a
# CUDA torchvision (or two different CUDA versions) fails at import.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" }
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" }
]

[tool.hatch.build.targets.wheel]
packages = ["src/annihilate"]
